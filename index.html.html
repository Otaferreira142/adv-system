<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adv System — Login</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* LOGIN */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, #0a1f44 0%, #0d0d0d 70%);
    }

    .login-box {
      background: #161616;
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 40px;
      width: 400px;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display:block;
      font-size:12px;
      color:#777;
      margin-bottom:6px;
    }

    .form-group input {
      width:100%;
      padding:12px;
      background:#111;
      border:1px solid #2a2a2a;
      color:#fff;
      border-radius:8px;
    }

    .btn-login {
      width:100%;
      padding:12px;
      background:#1a4fc4;
      color:#fff;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:700;
    }

    .login-error {
      display:none;
      margin-top:10px;
      color:#ff6b6b;
    }

    /* APP */
    #app-screen { display:none; }

    .sidebar {
      width:230px;
      min-height:100vh;
      background:#0a1f44;
      position:fixed;
      padding:20px;
      color:#fff;
    }

    .main {
      margin-left:230px;
      padding:20px;
    }

    table {
      width:100%;
      border-collapse:collapse;
    }

    td,th {
      padding:10px;
      border-bottom:1px solid #222;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>Login</h2>

    <div class="form-group">
      <label>Email</label>
      <input id="l-email" type="email">
    </div>

    <div class="form-group">
      <label>Senha</label>
      <input id="l-senha" type="password">
    </div>

    <button class="btn-login" onclick="fazerLogin()" id="btn-entrar">
      Entrar
    </button>

    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">

  <div class="sidebar">
    <h3>Adv System</h3>
    <p id="user-display-name"></p>
    <button onclick="fazerLogout()">Sair</button>
  </div>

  <div class="main">

    <h2>Painel</h2>
    <p id="current-date"></p>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Título</th>
          <th>Cliente</th>
          <th>Status</th>
          <th>Data</th>
        </tr>
      </thead>

      <tbody id="tbody"></tbody>
    </table>

  </div>
</div>

<!-- FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    getDocs,
    query,
    orderBy,
    addDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // 🔥 COLOCA SEU FIREBASE AQUI
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    projectId: "SEU_PROJECT_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  await setPersistence(auth, browserLocalPersistence);

  let tarefas = [];

  // LOGIN STATE
  onAuthStateChanged(auth, user => {
    if (user) {
      mostrarApp(user);
      carregar();
    } else {
      mostrarLogin();
    }
  });

  function mostrarApp(user) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';

    document.getElementById('user-display-name').innerText =
      user.email.split('@')[0];

    document.getElementById('current-date').innerText =
      new Date().toLocaleDateString('pt-BR');
  }

  function mostrarLogin() {
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
  }

  // LOGIN
  window.fazerLogin = async function () {
    const email = document.getElementById('l-email').value;
    const senha = document.getElementById('l-senha').value;
    const err = document.getElementById('login-error');

    try {
      await signInWithEmailAndPassword(auth, email, senha);
    } catch (e) {
      err.style.display = 'block';
      err.innerText = e.code;
    }
  };

  window.fazerLogout = async function () {
    await signOut(auth);
  };

  // CARREGAR DADOS
  async function carregar() {
    const q = query(collection(db, 'tarefas'), orderBy('data', 'desc'));
    const snap = await getDocs(q);

    tarefas = [];

    snap.forEach(doc => {
      tarefas.push(doc.data());
    });

    render();
  }

  function render() {
    const tbody = document.getElementById('tbody');

    if (!tarefas.length) {
      tbody.innerHTML = "<tr><td colspan='5'>Sem tarefas</td></tr>";
      return;
    }

    tbody.innerHTML = tarefas.map((t, i) => `
      <tr>
        <td>${i+1}</td>
        <td>${t.titulo}</td>
        <td>${t.cliente}</td>
        <td>${t.status}</td>
        <td>${new Date(t.data).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }

</script>

</body>
</html>
