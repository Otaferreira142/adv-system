<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adv System — Premium Legal Management</title>
  <style>
    :root {
      --bg-dark: #080808;
      --panel-dark: #121212;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --border: #262626;
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ══════════════════════════════
       TELA DE LOGIN (REESTILIZADA)
    ══════════════════════════════ */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #1e293b 0%, #080808 60%);
    }

    .login-box {
      background: var(--panel-dark);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }

    .login-logo .icon-wrap {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 20px;
      box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
    }

    .login-logo h1 { font-size: 26px; text-align: center; letter-spacing: -0.5px; }
    .login-logo p { color: var(--text-dim); text-align: center; font-size: 14px; margin-bottom: 32px; }

    .form-group label { color: var(--text-dim); font-size: 12px; font-weight: 600; margin-bottom: 8px; display: block; }
    .form-group input {
      width: 100%; background: #000; border: 1px solid var(--border);
      color: white; padding: 14px; border-radius: 12px; font-size: 15px; margin-bottom: 20px;
    }
    .form-group input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }

    .btn-login {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer;
      font-size: 16px; margin-top: 10px;
    }
    .btn-login:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-login:active { transform: scale(0.98); }

    /* ══════════════════════════════
       APP DASHBOARD (MODERNO)
    ══════════════════════════════ */
    #app-screen { display: none; }

    .sidebar {
      width: 260px; height: 100vh; position: fixed;
      background: var(--panel-dark); border-right: 1px solid var(--border);
      padding: 32px 24px; display: flex; flex-direction: column;
    }

    .sidebar .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }

    .nav-group { margin-bottom: 32px; }
    .nav-label { font-size: 11px; text-transform: uppercase; color: #4b5563; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; }

    .sidebar a {
      display: flex; align-items: center; gap: 12px; color: var(--text-dim);
      text-decoration: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 4px;
    }
    .sidebar a:hover, .sidebar a.active { background: var(--glass); color: white; }
    .sidebar a.active { color: var(--accent); background: rgba(59, 130, 246, 0.08); }

    .main { margin-left: 260px; padding: 40px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .date { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

    /* Cards Estatísticos */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .card {
      background: var(--panel-dark); padding: 24px; border-radius: 20px;
      border: 1px solid var(--border); position: relative;
    }
    .card h3 { font-size: 13px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
    .card p { font-size: 32px; font-weight: 800; }
    .card::after {
      content: ''; position: absolute; bottom: 0; left: 24px; right: 24px; height: 3px;
      border-radius: 3px 3px 0 0;
    }
    .total::after { background: var(--accent); }
    .pendente::after { background: #f59e0b; }
    .concluido::after { background: #10b981; }

    /* Tabela Premium */
    .section { background: var(--panel-dark); border-radius: 24px; border: 1px solid var(--border); overflow: hidden; }
    .section-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 16px 24px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
    td { padding: 18px 24px; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:hover td { background: var(--glass); }

    .badge { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-pendente { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    .badge-andamento { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
    .badge-concluido { background: rgba(16, 185, 129, 0.1); color: #10b981; }

    /* Modal Estilizado */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--panel-dark); width: 480px; padding: 40px; border-radius: 28px; border: 1px solid var(--border); }

    /* Utilitários */
    .btn-primary {
      background: var(--accent); color: white; border: none; padding: 12px 24px;
      border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--accent-hover); transform: scale(1.02); }
    
    .user-pill {
      margin-top: auto; background: var(--glass); border-radius: 16px;
      padding: 16px; display: flex; align-items: center; gap: 12px;
    }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon-wrap">⚖️</div>
      <h1>Adv System</h1>
      <p>Acesse sua conta jurídica</p>
    </div>
    <div class="form-group">
      <label>E-MAIL</label>
      <input id="l-email" type="email" placeholder="advogado@exemplo.com">
      <label>SENHA</label>
      <input id="l-senha" type="password" placeholder="••••••••">
    </div>
    <button class="btn-login" id="btn-entrar" onclick="fazerLogin()">Acessar Painel</button>
    <div class="login-error" id="login-error" style="color: #ef4444; font-size: 13px; margin-top: 15px; text-align: center; display: none;"></div>
  </div>
</div>

<div id="app-screen">
  <div class="sidebar">
    <div class="logo">⚖️ AdvSystem</div>
    <div class="nav-group">
      <div class="nav-label">Menu</div>
      <a href="#" class="active">📊 Dashboard</a>
      <a href="#">👥 Clientes</a>
      <a href="#">📁 Processos</a>
    </div>
    <div class="user-pill">
      <div style="width: 40px; height: 40px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold;" id="user-avatar">?</div>
      <div style="flex: 1">
        <div id="user-display-name" style="font-size: 14px; font-weight: 600;">Nome</div>
        <div id="user-role" style="font-size: 11px; color: var(--text-dim);">Advogado</div>
      </div>
      <button onclick="fazerLogout()" style="background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px;">⏻</button>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 style="font-size: 28px; letter-spacing: -1px;">Dashboard</h1>
        <div class="date" id="current-date"></div>
      </div>
      <button class="btn-primary" onclick="abrirModal()">＋ Nova Tarefa</button>
    </div>

    <div class="cards">
      <div class="card total"><h3>Total Clientes</h3><p id="clientes">0</p></div>
      <div class="card pendente"><h3>Pendentes</h3><p id="pendente">0</p></div>
      <div class="card concluido"><h3>Concluídas</h3><p id="concluido">0</p></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2 style="font-size: 18px;">Tarefas Recentes</h2>
        <input type="text" placeholder="Pesquisar..." oninput="filtrarTabela(this.value)" style="background: #000; border: 1px solid var(--border); color: white; padding: 8px 16px; border-radius: 10px; font-size: 13px;">
      </div>
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Cliente</th>
            <th>Status</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="tbody">
          </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 style="margin-bottom: 24px;">Nova Tarefa</h2>
    <div class="form-group">
      <label>TÍTULO</label>
      <input id="f-titulo" type="text" placeholder="Ex: Protocolar Petição">
      <label>CLIENTE</label>
      <input id="f-cliente" type="text" placeholder="Nome do Cliente">
      <label>STATUS</label>
      <select id="f-status" style="width: 100%; background: #000; border: 1px solid var(--border); color: white; padding: 14px; border-radius: 12px; margin-bottom: 20px;">
        <option value="pendente">Pendente</option>
        <option value="andamento">Em Andamento</option>
        <option value="concluido">Concluído</option>
      </select>
    </div>
    <div style="display: flex; gap: 12px; justify-content: flex-end;">
      <button class="btn-secondary" onclick="fecharModal()" style="background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 12px 24px; border-radius: 12px; cursor: pointer;">Cancelar</button>
      <button class="btn-primary" onclick="salvarTarefa()">Salvar Tarefa</button>
    </div>
  </div>
</div>

<script type="module">
  // [SEU CÓDIGO DE IMPORTAÇÃO E CONFIGURAÇÃO DO FIREBASE AQUI]

  // Certifique-se de manter a lógica de carregar() e fazerLogin() que já funciona.
</script>

</body>
</html>
