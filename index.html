<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adv System — Gestão Jurídica</title>
  <style>
    /* Estilos preservados e otimizados */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; overflow-x: hidden; }

    /* TELA DE LOGIN */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, #0a1f44 0%, #0d0d0d 70%);
    }
    .login-box { background: #161616; border: 1px solid #252525; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 24px 80px rgba(0,0,0,.6); }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .icon-wrap { width: 60px; height: 60px; background: linear-gradient(135deg, #1a4fc4, #4a7fff); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }
    
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; color: #777; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; background: #111; border: 1px solid #2a2a2a; color: white; padding: 12px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #4a7fff; }

    .btn-login, .btn-primary { width: 100%; background: linear-gradient(135deg, #1a4fc4, #4a7fff); color: white; border: none; padding: 13px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; transition: opacity .2s; }
    .btn-login:hover { opacity: .85; }
    
    .login-error { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: #f87171; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 16px; display: none; }

    /* APP SCREEN */
    #app-screen { display: none; }
    .sidebar { width: 230px; min-height: 100vh; background: linear-gradient(180deg, #0a1f44 0%, #071330 100%); position: fixed; display: flex; flex-direction: column; padding: 28px 20px; border-right: 1px solid #1e3a6e; }
    .sidebar a { display: flex; align-items: center; gap: 10px; color: #8aa8d4; text-decoration: none; padding: 9px 12px; border-radius: 8px; font-size: 14px; transition: all .2s; }
    .sidebar a.active, .sidebar a:hover { background: rgba(26,79,196,.25); color: #fff; }
    
    .main { margin-left: 230px; padding: 32px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #161616; border: 1px solid #222; padding: 20px; border-radius: 12px; }
    .card h3 { font-size: 12px; color: #666; margin-bottom: 10px; }
    .card p { font-size: 28px; font-weight: 700; }

    /* TABELA */
    .section { background: #161616; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #111; }
    th, td { padding: 14px 20px; text-align: left; font-size: 14px; border-bottom: 1px solid #1c1c1c; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; }
    .badge-pendente { background: rgba(245,158,11,.15); color: #f59e0b; }
    .badge-concluido { background: rgba(34,197,94,.15); color: #4ade80; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-overlay.show { display: flex; }
    .modal { background: #1a1a1a; padding: 30px; border-radius: 15px; width: 400px; border: 1px solid #333; }

    #toast { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; transform: translateY(100px); transition: 0.3s; z-index: 10000; }
    #toast.show { transform: translateY(0); }
  </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="icon-wrap">⚖️</div>
      <h1>Adv System</h1>
      <p>Acesso Restrito</p>
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="advogado@exemplo.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-password" placeholder="••••••••">
    </div>
    <button class="btn-login" id="btn-entrar">Entrar no Sistema</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD (APP) -->
<div id="app-screen">
  <div class="sidebar">
    <div style="margin-bottom: 40px; font-weight: bold; font-size: 20px;">⚖️ Adv System</div>
    <a href="#" class="active">📊 Dashboard</a>
    <a href="#">👥 Clientes</a>
    <a href="#">📁 Processos</a>
    <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #1e3a6e;">
      <div id="user-info" style="font-size: 13px; margin-bottom: 10px; color: #4a7fff;"></div>
      <button onclick="logout()" style="background:none; border:none; color:#ff4d4d; cursor:pointer; font-weight:bold;">⏻ Sair do Sistema</button>
    </div>
  </div>

  <div class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
      <h1>Painel de Controle</h1>
      <button class="btn-primary" style="width:auto; padding: 10px 20px;" onclick="toggleModal(true)">+ Nova Tarefa</button>
    </div>

    <div class="cards">
      <div class="card"><h3>Pendentes</h3><p id="count-pendente">0</p></div>
      <div class="card"><h3>Concluídas</h3><p id="count-concluido">0</p></div>
      <div class="card"><h3>Total</h3><p id="count-total">0</p></div>
    </div>

    <div class="section">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Cliente</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="task-list">
          <!-- Tarefas entram aqui -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL TAREFA -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <h2 style="margin-bottom:20px">Nova Tarefa</h2>
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="task-title">
    </div>
    <div class="form-group">
      <label>Cliente</label>
      <input type="text" id="task-client">
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="task-status">
        <option value="pendente">Pendente</option>
        <option value="concluido">Concluído</option>
      </select>
    </div>
    <div style="display:flex; gap:10px">
      <button class="btn-primary" id="btn-save-task">Salvar</button>
      <button class="btn-login" style="background:#333" onclick="toggleModal(false)">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // --- CONFIGURAÇÃO FIREBASE ---
  // IMPORTANTE: Substitua pelos dados do seu Console Firebase
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    projectId: "SEU_PROJETO_ID",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "SEU_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app-screen');
  const loginError = document.getElementById('login-error');
  const taskList = document.getElementById('task-list');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginScreen.style.display = 'none';
      appScreen.style.display = 'block';
      document.getElementById('user-info').textContent = `Logado como: ${user.email}`;
      listenTasks();
    } else {
      loginScreen.style.display = 'flex';
      appScreen.style.display = 'none';
    }
  });

  document.getElementById('btn-entrar').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-password').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (error) {
      loginError.style.display = 'block';
      loginError.textContent = "Erro: Usuário ou senha inválidos.";
    }
  });

  window.logout = () => signOut(auth);

  window.toggleModal = (show) => {
    document.getElementById('modal-task').classList.toggle('show', show);
  };

  document.getElementById('btn-save-task').addEventListener('click', async () => {
    const title = document.getElementById('task-title').value;
    const client = document.getElementById('task-client').value;
    const status = document.getElementById('task-status').value;
    if(!title || !client) return showToast("Preencha tudo!", true);
    try {
      await addDoc(collection(db, "tarefas"), {
        titulo: title,
        cliente: client,
        status: status,
        dataCriacao: new Date().toISOString(),
        userId: auth.currentUser.uid
      });
      toggleModal(false);
      showToast("Tarefa adicionada!");
    } catch (e) {
      showToast("Erro ao salvar", true);
    }
  });

  function listenTasks() {
    const q = query(collection(db, "tarefas"), orderBy("dataCriacao", "desc"));
    onSnapshot(q, (snapshot) => {
      let html = '';
      let counts = { pendente: 0, concluido: 0, total: 0 };
      snapshot.forEach((doc) => {
        const task = doc.data();
        counts.total++;
        counts[task.status]++;
        html += `
          <tr>
            <td>${task.titulo}</td>
            <td>${task.cliente}</td>
            <td><span class="badge badge-${task.status}">${task.status.toUpperCase()}</span></td>
            <td><button onclick="deleteTask('${doc.id}')" style="color:#ff4d4d; background:none; border:none; cursor:pointer">Excluir</button></td>
          </tr>
        `;
      });
      taskList.innerHTML = html;
      document.getElementById('count-pendente').textContent = counts.pendente;
      document.getElementById('count-concluido').textContent = counts.concluido;
      document.getElementById('count-total').textContent = counts.total;
    });
  }

  window.deleteTask = async (id) => {
    if(confirm("Deseja excluir esta tarefa?")) {
      await deleteDoc(doc(db, "tarefas", id));
      showToast("Tarefa excluída");
    }
  };

  function showToast(msg, err = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = err ? "#ef4444" : "#22c55e";
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
