<html>
<head>
    <title>Advanced System</title>
</head>
<body>
    <h1>Welcome to the Advanced System</h1>
    <div id="chat">
        <h2>Chat Room</h2>
        <div id="messages"></div>
        <textarea id="messageInput"></textarea>
        <button id="sendButton">Send</button>
    </div>
    <div id="fileUpload">
        <h2>Upload Files</h2>
        <input type="file" id="fileInput" />
        <button id="uploadButton">Upload</button>
    </div>
    <div id="updates">
        <h2>Updates</h2>
        <ul id="updatesList"></ul>
    </div>
    <div id="statusTracking">
        <h2>Status Tracking</h2>
        <table>
            <tr><th>Activity</th><th>Status</th></tr>
            <tr><td>File Upload</td><td id="fileUploadStatus">Pending</td></tr>
            <tr><td>Chat Message</td><td id="chatStatus">Pending</td></tr>
        </table>
    </div>
    <script>
        document.getElementById('sendButton').onclick = function() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += `<p>${message}</p>`;
            input.value = '';
            document.getElementById('chatStatus').innerText = 'Message Sent';
        };

        document.getElementById('uploadButton').onclick = function() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length > 0) {
                document.getElementById('fileUploadStatus').innerText = 'File Uploaded';
                // Simulating file upload logic
            }
        };
    </script>
</body>
</html>
