<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JurisFlow | Gestão Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #080a0f;
            --bg-card: #111827;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

        .app-container { display: flex; min-height: 100vh; }

        /* Sidebar Moderna */
        .sidebar {
            width: 260px;
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo { font-weight: 700; font-size: 1.5rem; margin-bottom: 40px; color: var(--accent); display: flex; align-items: center; gap: 10px; }

        .nav-link {
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 5px;
            transition: 0.2s;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); }

        /* Conteúdo Principal */
        .main-content { flex: 1; padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .top-bar h1 { font-size: 1.8rem; font-weight: 700; }

        /* Cards de Estatísticas */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .stat-card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .stat-card h3 { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .stat-card p { font-size: 2rem; font-weight: 700; }

        /* Tabela Estilizada */
        .table-wrapper {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.02); padding: 18px; text-align: left; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        td { padding: 18px; border-top: 1px solid var(--border); font-size: 0.95rem; }

        /* Badges de Status */
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .st-pendente { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .st-andamento { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .st-concluido { background: rgba(16, 185, 129, 0.1); color: #10b981; }

        /* Botões */
        .btn-primary { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .btn-delete { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: 600; opacity: 0.7; }
        .btn-delete:hover { opacity: 1; }

        /* Modal Moderno */
        .modal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); 
            display: none; align-items: center; justify-content: center; z-index: 100; 
        }
        .modal-content {
            background: var(--bg-card); padding: 40px; border-radius: 24px; width: 100%; max-width: 450px;
            border: 1px solid var(--border); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        input, select {
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.03); color: white; margin-bottom: 20px; outline: none;
        }
        input:focus { border-color: var(--accent); }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo"><span>⚖️</span> JurisFlow</div>
        <nav>
            <a href="#" class="nav-link active">Dashboard</a>
            <a href="#" class="nav-link">Processos</a>
            <a href="#" class="nav-link">Clientes</a>
            <a href="#" class="nav-link">Agenda</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1>Visão Geral</h1>
            <button class="btn-primary" onclick="toggleModal(true)">+ Nova Demanda</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>Pendentes</h3><p id="count-pendente">0</p></div>
            <div class="stat-card"><h3>Em Curso</h3><p id="count-andamento">0</p></div>
            <div class="stat-card"><h3>Finalizados</h3><p id="count-concluido">0</p></div>
            <div class="stat-card" style="background: linear-gradient(135deg, #1e293b, #111827); border-color: var(--accent);">
                <h3>Total Geral</h3><p id="count-total">0</p>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>PROCESSO / TÍTULO</th>
                        <th>RESPONSÁVEL</th>
                        <th>STATUS</th>
                        <th>DATA</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="task-list">
                    </tbody>
            </table>
        </div>
    </main>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 style="margin-bottom: 25px;">Cadastrar Demanda</h2>
        <input type="text" id="in-titulo" placeholder="Nome do Processo ou Tarefa">
        <input type="text" id="in-responsavel" placeholder="Advogado Responsável">
        <select id="in-status">
            <option value="pendente">Pendente</option>
            <option value="andamento">Em Andamento</option>
            <option value="concluido">Concluído</option>
        </select>
        <div style="display: flex; gap: 10px;">
            <button class="btn-primary" style="flex: 1;" onclick="handleSave()">Salvar</button>
            <button class="btn-primary" style="flex: 1; background: #374151;" onclick="toggleModal(false)">Cancelar</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('juris_db')) || [];

    const toggleModal = (show) => {
        document.getElementById('modal').style.display = show ? 'flex' : 'none';
        if(!show) {
            document.getElementById('in-titulo').value = '';
            document.getElementById('in-responsavel').value = '';
        }
    }

    const handleSave = () => {
        const tit = document.getElementById('in-titulo').value;
        const res = document.getElementById('in-responsavel').value;
        const sta = document.getElementById('in-status').value;

        if(!tit || !res) return alert("Preencha todos os campos!");

        db.push({
            id: Date.now(),
            titulo: tit,
            responsavel: res,
            status: sta,
            data: new Date().toLocaleDateString('pt-BR')
        });

        saveAndRender();
        toggleModal(false);
    }

    const deleteItem = (id) => {
        db = db.filter(item => item.id !== id);
        saveAndRender();
    }

    const saveAndRender = () => {
        localStorage.setItem('juris_db', JSON.stringify(db));
        render();
    }

    const render = () => {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        
        let counts = { pendente: 0, andamento: 0, concluido: 0 };

        db.forEach(item => {
            counts[item.status]++;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 600;">${item.titulo}</td>
                <td style="color: var(--text-muted);">${item.responsavel}</td>
                <td><span class="badge st-${item.status}">${item.status.toUpperCase()}</span></td>
                <td style="color: var(--text-muted);">${item.data}</td>
                <td><button class="btn-delete" onclick="deleteItem(${item.id})">Remover</button></td>
            `;
            list.appendChild(tr);
        });

        // Atualiza contadores
        document.getElementById('count-pendente').innerText = counts.pendente;
        document.getElementById('count-andamento').innerText = counts.andamento;
        document.getElementById('count-concluido').innerText = counts.concluido;
        document.getElementById('count-total').innerText = db.length;
    }

    // Inicialização
    render();
</script>

</body>
</html>
